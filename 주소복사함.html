<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAA 주소 복사함</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#16233F;--ink-soft:#2C3E5E;--paper:#EFF2F6;--surface:#fff;--coral:#E2574C;--amber:#C9922E;--muted:#6B7A90;--line:#D9E0E9}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--paper);
  color:var(--ink);line-height:1.6;padding:28px 16px 60px;word-break:keep-all}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.03em}
.intro{margin-top:6px;font-size:14.5px;color:var(--ink-soft)}
.ver{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ver label{font-size:15px;font-weight:700}
.ver input{width:72px;padding:8px 10px;font:inherit;font-size:17px;font-weight:700;text-align:center;
  border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.ver input:focus{outline:2px solid var(--coral);outline-offset:1px}
.ver small{font-size:13px;color:var(--muted);flex:1 1 220px}
.group{margin-top:26px}
.group h2{font-size:17px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.group .org{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.row{background:var(--surface);border:1px solid var(--line);border-top:none;padding:14px 16px;
  display:flex;align-items:center;gap:12px}
.row .t{flex:1;min-width:0}
.row strong{display:block;font-size:15.5px}
.row code{display:block;font-size:12px;color:var(--muted);word-break:break-all;margin-top:2px;font-family:inherit}
.row button{flex:0 0 auto;padding:11px 16px;border:none;border-radius:8px;background:var(--ink);color:#fff;
  font:inherit;font-size:15px;font-weight:700;cursor:pointer;min-width:84px}
.row button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row button.ok{background:#1A6B3C}
.how{margin-top:30px;background:#FFF8E9;border:1px solid #EBD9A8;border-radius:12px;padding:18px 20px}
.how h3{font-size:15px;color:#8A6A1E;margin-bottom:8px}
.how ol{margin-left:20px;font-size:14px;line-height:1.9;color:#4A4033}
</style>
</head>
<body>
<div class="wrap">
  <h1>주소 복사함</h1>
  <p class="intro">복사 버튼을 누르면 주소만 정확히 복사됩니다. 카톡에 붙여 넣어 보내세요.</p>

  <div class="ver">
    <label for="v">끝 번호 ?v=</label>
    <input id="v" type="number" min="1" value="5" inputmode="numeric">
    <small>파일을 고쳐 다시 올렸을 때만 1씩 올리세요. 아래 모든 주소에 한꺼번에 적용됩니다.</small>
  </div>

  <!-- ▼ 인물 추가: group 블록 하나를 복사해 이름·주소만 바꾸면 됩니다 -->
  <div class="group">
    <h2>송주권 단장<span class="org">아이에프씨 그룹 더모아사업단</span></h2>
    <div class="row" data-url="https://withaiacademy.github.io/IFC/송주권_단장_전자명함.html">
      <div class="t"><strong>전자명함</strong><code></code></div><button type="button">복사</button></div>
    <div class="row" data-url="https://withaiacademy.github.io/IFC/송주권_단장_미니사이트.html">
      <div class="t"><strong>미니사이트</strong><code></code></div><button type="button">복사</button></div>
    <div class="row" data-url="https://withaiacademy.github.io/IFC/송주권_단장_SNS홍보카드.html">
      <div class="t"><strong>SNS 홍보카드</strong><code></code></div><button type="button">복사</button></div>
  </div>
  <!-- ▲ 인물 추가 끝 -->

  <div class="how">
    <h3>보내는 순서</h3>
    <ol>
      <li>복사 버튼을 누릅니다.</li>
      <li>카톡 '나와의 채팅'에 붙여 넣고, 다른 글자 없이 보냅니다.</li>
      <li>카드 옆 ↪ 버튼으로 고객에게 공유합니다.</li>
      <li>인사말은 카드 보내기 전에 따로 보냅니다.</li>
    </ol>
  </div>
</div>

<script>
var vInput = document.getElementById('v');
try{ var saved = localStorage.getItem('waa_v'); if(saved) vInput.value = saved; }catch(e){}

function fullUrl(row){
  var n = parseInt(vInput.value, 10);
  return row.getAttribute('data-url') + (n > 0 ? '?v=' + n : '');
}
function refresh(){
  document.querySelectorAll('.row').forEach(function(r){ r.querySelector('code').textContent = fullUrl(r); });
  try{ localStorage.setItem('waa_v', vInput.value); }catch(e){}
}
vInput.addEventListener('input', refresh);
refresh();

function copy(text, btn){
  function done(){
    btn.textContent = '복사됨 ✓'; btn.classList.add('ok');
    setTimeout(function(){ btn.textContent = '복사'; btn.classList.remove('ok'); }, 1800);
  }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.top = '-9999px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    ok ? done() : alert('복사가 되지 않았습니다. 주소를 직접 선택해 복사해 주세요.');
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else{ fallback(); }
}
document.querySelectorAll('.row button').forEach(function(b){
  b.addEventListener('click', function(){ copy(fullUrl(b.closest('.row')), b); });
});
</script>
</body>
</html>
